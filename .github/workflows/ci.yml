name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 \
            | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))'
      - name: Check JavaScript syntax
        run: find popup -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check that every referenced app icon exists
        run: |
          node -e '
            const fs = require("fs");
            const missing = require("./config/apps.json").apps
              .map(a => a.icon).filter(i => !fs.existsSync("." + i));
            if (missing.length) { console.error("Missing icons:", missing); process.exit(1); }'

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: |
          version=$(node -p 'require("./manifest.json").version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Build package
        run: |
          zip -r "proton-launcher-extension-v${GITHUB_REF_NAME#v}.zip" \
            manifest.json LICENSE _locales assets config popup
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "v${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" proton-launcher-extension-v*.zip --clobber
