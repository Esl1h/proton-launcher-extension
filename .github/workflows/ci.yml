name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 \
            | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))'
      - name: Check JavaScript syntax
        run: find popup options common -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check app ids and icons
        run: |
          node -e '
            const fs = require("fs");
            const apps = require("./config/apps.json").apps;
            const missing = apps.map(a => a.icon).filter(i => !fs.existsSync("." + i));
            if (missing.length) { console.error("Missing icons:", missing); process.exit(1); }
            const ids = apps.map(a => a.id);
            const bad = ids.filter((id, i) => !id || ids.indexOf(id) !== i);
            if (bad.length) { console.error("Missing or duplicate app ids:", bad); process.exit(1); }'
      - name: Lint for Firefox (addons.mozilla.org rules)
        # Install outside the source dir, without lifecycle scripts, instead of npx.
        run: |
          npm install --prefix "$RUNNER_TEMP/web-ext" --ignore-scripts --no-audit --no-fund web-ext@8.10.0
          "$RUNNER_TEMP/web-ext/node_modules/.bin/web-ext" lint --source-dir . --ignore-files 'docs/**' '.github/**' --warnings-as-errors

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: |
          version=$(node -p 'require("./manifest.json").version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Build package
        run: |
          zip -r "proton-launcher-extension-v${GITHUB_REF_NAME#v}.zip" \
            manifest.json LICENSE _locales assets common config options popup
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "v${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" proton-launcher-extension-v*.zip --clobber
