<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proton Launcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="header-logo">
        <img src="../assets/proton-logo.svg" alt="Proton" class="proton-logo" />
      </div>
      
      <div class="grid-container">
        <div class="app-grid" id="appGrid">
        </div>
      </div>
      
      <div class="status-section">
        <div class="status-line" id="statusLine1" data-i18n="loadingConfigs"></div>
        <div class="status-line" id="statusLine2" data-i18n="ready"></div>
      </div>
      
      <div class="status-section">
        <div class="status-line">
          <a href="#" id="statusLink" data-i18n="servicesStatus" style="color: rgba(255, 255, 255, 0.9); text-decoration: none;"></a>
        </div>
        <div class="status-line">
          <a href="#" id="appsLink" data-i18n="downloadApps" style="color: rgba(255, 255, 255, 0.9); text-decoration: none;"></a>
        </div>
      </div>
      
      <div class="settings-button">
        <button id="reloadBtn" data-i18n-title="reloadTitle">🔄</button>
      </div>
    </div>
    
    <script src="popup.js"></script>
  </body>
</html>
